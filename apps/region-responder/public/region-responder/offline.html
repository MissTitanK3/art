<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #0f1115;
        color: #f8fafc;
      }
      .card {
        max-width: 420px;
        width: 100%;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        padding: 1.5rem;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 0.75rem;
        line-height: 1.5;
      }
      small {
        color: rgba(248, 250, 252, 0.7);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Offline mode</h1>
      <p>You are offline. Cached pages and assets remain available for now.</p>
      <p>Reconnect to sync new data once you have a signal.</p>
      <small>ART Region Responder</small>
    </main>
  </body>
</html>
