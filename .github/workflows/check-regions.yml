name: Check regions alignment

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/**"
      - "scripts/**"
      - ".github/workflows/**"

jobs:
  check-regions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Run region check
        run: pnpm run check:regions:ci
        # The script exits non-zero when regions diverge, failing the job
