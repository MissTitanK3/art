name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # Use Corepack to ensure the repo's declared pnpm version is used
      - name: Enable Corepack
        run: corepack enable

      - name: Show pnpm version
        run: pnpm -v

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -w lint

      - name: Build
        run: pnpm -w build

      - name: Validate Academy Content
        run: pnpm -w run validate:academy

      - name: Tests (if present)
        run: pnpm -w test --if-present

